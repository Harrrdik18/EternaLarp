services:
  db:
    image: postgres:17-alpine
    container_name: signal-studio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: signal_studio
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - signal-postgres-data:/var/lib/postgresql/data
      - ./server/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal_studio"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal-postgres-data:
